<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charusat University Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .
    }

    .card {
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  width: 300px;
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
  transform: translateY(-10px) scale(1.05); /* moves up + scales */
  box-shadow: 0 8px 16px rgba(0,0,0,0.3);   /* deeper shadow */
}

    

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    .card-content h2 {
      margin: 0;
      font-size: 20px;
      color: #333;
    }

    .card-content p {
      font-size: 14px;
      color: #555;
      margin-top: 8px;
    }

    .card-content a {
      display: inline-block;
      margin-top: 12px;
      text-decoration: none;
      background: #0073e6;
      color: #fff;
      padding: 8px 12px;
      border-radius: 5px;
      transition: background 0.3s;
    }

    .card-content a:hover {
      background: #005bb5;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://www.charusat.ac.in/images/charusat-campus.jpg" alt="Charusat University">
    <div class="card-content">
      <h2>Charusat University</h2>
      <p>CHARUSAT is a leading university in Gujarat, offering diverse programs in engineering, science, and healthcare.</p>
      <a href="https://www.charusat.ac.in" target="_blank">Visit Website</a>
    </div>
  </div>
</body>
</html>
